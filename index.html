<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Gabriel Bastians Dias em forma de terminal interativo." />
    <meta name="theme-color" content="#020a04" />
    <title>GBD Terminal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23020a04'/><rect x='3' y='3' width='6' height='10' fill='%2333ff66'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="bg-black">
    <div id="crt" class="crt relative flex h-dvh flex-col overflow-hidden bg-crt font-term text-phosphor">
      <header
        class="flex shrink-0 flex-wrap justify-between gap-x-4 bg-phosphor px-3 py-0.5 text-crt text-base uppercase tracking-wide sm:text-lg"
      >
        <span>guest@gbd — tty1</span>
        <span class="hidden sm:inline">sh · 80×24</span>
        <span>Sessão <span id="clock">00:00:00</span></span>
      </header>

      <main id="screen" class="flex-1 overflow-y-auto px-3 py-3 text-lg leading-snug sm:px-6 sm:text-xl">
        <div id="output" aria-live="polite"></div>
        <div id="prompt-line" class="flex" hidden>
          <label for="input" id="prompt-label" class="shrink-0 whitespace-pre text-phosphor-bright"></label>
          <input
            id="input"
            class="min-w-0 flex-1 bg-transparent text-phosphor outline-none"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="send"
          />
        </div>
      </main>

      <div class="scanlines pointer-events-none absolute inset-0" aria-hidden="true"></div>
      <div class="vignette pointer-events-none absolute inset-0" aria-hidden="true"></div>
    </div>
  </body>
</html>
